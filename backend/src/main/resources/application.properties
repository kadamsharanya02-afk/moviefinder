server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/moviefinder_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:sharanya}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Exclude eager OpenAI autoconfiguration so application runs smoothly out-of-the-box
# and dynamically connects to OpenAI when key is supplied via OPENAI_API_KEY
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

# Security & JWT Configuration
moviefinder.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
moviefinder.jwt.expiration-ms=86400000

# Spring AI Configuration (Securely configured via environment variables)
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.7

# TMDB External API Key (Optional environment variable)
tmdb.api.key=${TMDB_API_KEY:}

# Logging
logging.level.com.moviefinder=INFO
logging.level.org.springframework.security=WARN
